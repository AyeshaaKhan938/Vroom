name: Deploy Vroom to cPanel

on:
  push:
    branches: [ Release ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: |
          echo "🚀 Building Vroom Next.js app..."
          npm run build
          echo "✅ Build completed!"

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: host37.registrar-servers.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/vroom/
          local-dir: ./out/       # ✅ Static export directory
          protocol: ftp
          port: 21
          timeout: 60000
          dangerousCleanSlate: true
